<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom of Devil Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=UnifrakturCook:wght@700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blood:#c4141f;--ember:#ff5a1f;--bone:#efe6d8;--ink:#0a0507;--panel:rgba(18,6,9,.82);--line:rgba(196,20,31,.55);--muted:#b9a99a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink);color:var(--bone);font:16px/1.65 "Noto Sans Sinhala",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--ink) var(--bgimg) center/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,5,7,.35),rgba(10,5,7,.9) 70%)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.hero{padding:72px 0 40px;text-align:center}
h1{font:400 clamp(44px,11vw,104px)/.95 "Pirata One","Impact",serif;margin:0;letter-spacing:.02em;color:var(--bone);text-shadow:0 0 28px rgba(196,20,31,.85),0 3px 0 #5a0a10;animation:flick 1.6s ease-out 1}
@keyframes flick{0%,18%,22%,60%{opacity:.35}20%,55%,100%{opacity:1}}
.hero p{max-width:34em;margin:18px auto 0;color:var(--muted)}
.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn,.chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(12,4,6,.7);color:var(--bone);padding:8px 16px;border-radius:4px;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover,.chip:hover{background:rgba(196,20,31,.35);border-color:var(--ember)}
.btn.primary,.chip[aria-pressed=true]{background:var(--blood);border-color:var(--ember)}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h2{font:400 clamp(30px,6vw,46px)/1.1 "Pirata One",serif;margin:0 0 6px;color:var(--bone)}
section{padding:34px 0}
.sub{color:var(--muted);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:6px 13px;font-size:14px}
.tool{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blood);padding:18px;border-radius:4px;backdrop-filter:blur(4px)}
.tool h3{margin:0 0 4px;font:400 26px "Pirata One",serif}
.tool .d{margin:0 0 12px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
textarea,input[type=text],input[type=password],input[type=number]{width:100%;background:rgba(0,0,0,.55);color:var(--bone);border:1px solid #4a1b20;border-radius:4px;padding:10px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
textarea{min-height:110px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.err{color:#ff8a7a;font-size:14px;min-height:20px;margin-top:8px}
.biz{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:4px;display:flex;flex-direction:column}
.card h3{margin:0 0 4px;font:400 32px/1.1 "Pirata One",serif}
.card ul{margin:12px 0 18px;padding-left:20px}
.card li{margin:4px 0}
.card .btn{margin-top:auto;text-align:center;display:block}
